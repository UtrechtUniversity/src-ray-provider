# Example Ray cluster configuration for the SRC node provider.
# The provider injects an installation command for the autoscaler package
# into the head's setup commands automatically.
cluster_name: src-ray-example

provider:
  type: external
  module: src_ray_provider.node_provider.ResearchCloudNodeProvider
  co_name: Example CO
  wallet_name: Example Wallet
  cloud_name: SURF HPC Cloud # this is the default and can be left out. You can alter it for AWS etc.
  # network_name_hint: example-network # if there are multiple networks, this helps the provider choose the correct one

auth:
  ssh_user: ray
  # ssh_private_key: ~/.ssh/...
  # ssh_public_key: ~/.ssh/...
  # Both must be set together, or both left commented out. If left unset,
  # the provider generates and reuses its own keypair for this cluster_name
  # (see README.md). The head node needs the private key (which Ray syncs
  # onto it automatically) to SSH into newly created worker nodes that were
  # provisioned with the matching public key.

# The "external" provider type only ships a minimal default config, so these
# keys (normally filled in by each built-in provider's defaults.yaml) must be
# set explicitly or `ray up` fails with a KeyError while merging commands.
initialization_commands: []
setup_commands: []
head_setup_commands: []
worker_setup_commands: []
file_mounts: {}
cluster_synced_files: []
file_mounts_sync_continuously: false
rsync_exclude: []
rsync_filter: []

head_start_ray_commands:
  - ray stop
  - >-
    RESEARCH_CLOUD_TOKEN="$(cat ~/.researchcloud-token)" ray start --head
    --port=6379 --dashboard-host=0.0.0.0
    --autoscaling-config=~/ray_bootstrap_config.yaml

worker_start_ray_commands:
  - ray stop
  - ray start --address=$RAY_HEAD_IP:6379

# Global cap on worker nodes across the whole cluster. During bootstrap, the
# provider creates a Ray node type for each size flavour in the Ray Head Node
# and Ray Worker catalog items before Ray validates the configuration. The
# smallest-CPU head flavour is selected by default; define head_node_type /
# available_node_types below to override.
max_workers: 4

idle_timeout_minutes: 10
