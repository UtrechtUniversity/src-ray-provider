# Example Ray cluster configuration for the SRC node provider.
# The provider injects an installation command for the autoscaler package
# into the head's setup commands automatically.
cluster_name: src-ray-example

provider:
  type: external
  module: src_ray_provider.node_provider.ResearchCloudNodeProvider
  co_name: Example CO
  wallet_name: Example Wallet
  # cloud_name: SURF HPC Cloud # This is the default and can be left out. You can alter it for AWS etc.
  # network_name_hint: example-network # If there are multiple networks, this helps the provider choose the correct one
  # idle_timeout_minutes: 3 # After how many minutes of idleness a worker node should be terminated
  # resume_paused_workspaces: true # Attempt to resume or pause nodes instead of creating or deleting new ones
  # resume_min_ttl_seconds: 3600 # When using resume_paused_workspaces: only resume workspaces with more than 1 hours remaining

# The auth block is used to configure SSH access to the cluster nodes.
# You can leave it out to work with the defaults described below.
# auth:
  # ssh_user: ray
  # ssh_private_key: ~/.ssh/...
  # ssh_public_key: ~/.ssh/...
  # Both must be set together, or both left commented out. If left unset,
  # the provider generates and reuses its own keypair for this cluster_name
  # (see README.md).
  # **WARNING**: The head node needs the private key (which Ray syncs
  # onto it automatically) to SSH into newly created worker nodes that were
  # provisioned with the matching public key. Do NOT set this to your personal
  # SSH keys!

# The "external" provider type only ships a minimal default config, so these
# keys (normally filled in by each built-in provider's defaults.yaml) must be
# set explicitly or `ray up` fails with a KeyError while merging commands.
initialization_commands: []
setup_commands: []
head_setup_commands: []
worker_setup_commands: []
file_mounts: {}
cluster_synced_files: []
file_mounts_sync_continuously: false
rsync_exclude: []
rsync_filter: []

# Global cap on worker nodes across the whole cluster. During bootstrap, the
# provider creates Ray node types for CPU-only head and CPU/GPU worker size
# flavours before Ray validates the configuration. The smallest-CPU head
# flavour is selected by default; define head_node_type / available_node_types
# below to override. Generated head types advertise zero CPUs to Ray by default.
max_workers: 4

# Override Ray extras per node type. Workers otherwise infer extras from the
# head's installed Ray dependencies; the head uses its fixed default.
# head_node_type: head
# available_node_types:
#   head:
#     node_config:
#       ray_packages: "default,client"
#   worker_4_core_16_gb:
#     node_config:
#       ray_packages: "client,tune"

idle_timeout_minutes: 10 # After how many minutes of idleness a worker node should be terminated.
# idle_timeout_minutes: 3 # If resume_paused_workspaces is true, you may want to be quicker with idle termination, since paused workspaces can be resumed quickly.
